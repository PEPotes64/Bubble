<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble Music - Prototipo</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0a0c">
</head>
<body style="background: #0a0a0c; color: #fff; font-family: sans-serif; padding: 20px;">

  <h1>Bubble Music 🫧</h1>
  <p>Pegá el link público de tu playlist de Spotify:</p>
  
  <input type="text" id="urlInput" placeholder="https://open.spotify.com/playlist/..." style="width: 80%; padding: 10px;">
  <button onclick="cargarPlaylist()" style="padding: 10px;">Cargar Rolas Bv</button>

  <hr style="margin-top: 20px;">

  <div id="status">Esperando URL...</div>
  <ul id="listaCanciones" style="margin-top: 15px;"></ul>

  <div id="player" style="margin-top: 20px;"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '200',
        width: '100%',
        videoId: '',
      });
    }

    async function cargarPlaylist() {
      const url = document.getElementById('urlInput').value;
      const status = document.getElementById('status');
      const lista = document.getElementById('listaCanciones');

      status.innerText = 'Extrayendo canciones de la playlist...';
      lista.innerHTML = '';

      try {
        const res = await fetch('/api/convertir-url', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const data = await res.json();

        if (data.exito) {
          status.innerText = `¡Éxito cerote! Se encontraron ${data.canciones.length} rolas.`;
          
          data.canciones.forEach((cancion) => {
            const li = document.createElement('li');
            li.innerText = `${cancion.titulo} - ${cancion.artista}`;
            li.style.cursor = 'pointer';
            li.style.padding = '5px 0';
            li.onclick = () => reproducirEnYoutube(cancion.query);
            lista.appendChild(li);
          });

          if (data.canciones.length > 0) {
            reproducirEnYoutube(data.canciones[0].query);
          }
        } else {
          status.innerText = 'Error: ' + data.error;
        }
      } catch (err) {
        status.innerText = 'Valió gorro el servidor :v';
      }
    }

    async function reproducirEnYoutube(query) {
      const status = document.getElementById('status');
      status.innerText = `Buscando en YouTube: ${query}...`;

      const res = await fetch('/api/buscar-yt', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query })
      });

      const data = await res.json();
      if (data.videoId) {
        status.innerText = `Sonando: ${query} Bv`;
        player.loadVideoById(data.videoId);
      } else {
        status.innerText = 'No se encontró en YouTube >:v';
      }
    }
  </script>
</body>
</html>
