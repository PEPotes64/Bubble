<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bubble Music</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a0a0c">
</head>
<body style="background: #0a0a0c; color: #fff; font-family: sans-serif; padding: 20px;">

  <h1>Bubble Music 🫧</h1>
  <p>Pega el link publico de tu playlist de Spotify:</p>
  
  <input type="text" id="urlInput" placeholder="https://open.spotify.com/playlist/..." style="width: 80%; padding: 10px;">
  <button onclick="cargarPlaylist()" style="padding: 10px;">Cargar Rolas Bv</button>

  <hr style="margin-top: 20px;">

  <div id="status">Esperando URL...</div>

  <!-- Reproductor fijo para que nunca desaparezca -->
  <div style="margin-top: 20px; background: #16161a; padding: 10px; border-radius: 12px;">
    <iframe id="ytIframe" width="100%" height="200" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen style="border-radius:8px;"></iframe>
  </div>

  <ul id="listaCanciones" style="margin-top: 15px;"></ul>

  <script>
    async function cargarPlaylist() {
      const url = document.getElementById('urlInput').value;
      const status = document.getElementById('status');
      const lista = document.getElementById('listaCanciones');

      if (!url) return alert('Pega una URL primero cerote :v');

      status.innerText = 'Extrayendo canciones...';
      lista.innerHTML = '';

      try {
        const res = await fetch('/api/convertir-url', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const data = await res.json();

        if (data.exito) {
          status.innerText = 'Exito! Se encontraron ' + data.canciones.length + ' rolas. Toca una para sonar:';
          
          data.canciones.forEach((cancion) => {
            const li = document.createElement('li');
            li.innerText = cancion.titulo + ' - ' + (cancion.artista || 'Desconocido');
            li.style.cursor = 'pointer';
            li.style.padding = '8px 0';
            li.style.borderBottom = '1px solid #222';
            li.onclick = () => reproducirEnYoutube(cancion.query);
            lista.appendChild(li);
          });
        } else {
          status.innerText = 'Error: ' + data.error;
        }
      } catch (err) {
        status.innerText = 'Valio gorro el servidor :v';
      }
    }

    async function reproducirEnYoutube(query) {
      const status = document.getElementById('status');
      const iframe = document.getElementById('ytIframe');
      status.innerText = 'Buscando: ' + query + '...';

      try {
        const res = await fetch('/api/buscar-yt', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });

        const data = await res.json();
        if (data.videoId) {
          status.innerText = 'Sonando: ' + query + ' Bv';
          iframe.src = 'https://www.youtube.com/embed/' + data.videoId + '?autoplay=1';
        } else {
          status.innerText = 'No se encontro la rola >:v';
        }
      } catch (err) {
        status.innerText = 'Error al conectar :v';
      }
    }
  </script>
</body>
</html>
